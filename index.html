<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CEI PWA Pro</title><link rel="manifest" href="manifest.json"><style>body{font-family:system-ui;margin:0;background:#f5f7fb}header{background:#102a43;color:#fff;padding:12px}.tabs{display:flex;overflow:auto;background:#e5e7eb}.tabs button{padding:10px;border:0}.tab{display:none;padding:12px}.active{display:block}.card{background:#fff;border-radius:10px;padding:12px;margin:8px 0}textarea,input,select{width:100%}.kpi{font-size:32px;font-weight:bold}</style></head><body><header><h2>CEI PWA Pro v1.0</h2></header><div class=tabs><button onclick=s('d')>Dashboard</button><button onclick=s('r')>Radar</button><button onclick=s('p')>Predictions</button><button onclick=s('b')>Brief</button><button onclick=s('sv')>Sources</button></div><div id=d class='tab active'><div class=card><div class=kpi id=k>0/100</div><input id=cdei type=range min=0 max=100 oninput='k.innerText=this.value+"/100";save()'></div><div class=card><textarea id=signals rows=6 placeholder='Top 5 signals'></textarea></div><div class=card><textarea id=ammo rows=4 placeholder='Leadership ammo'></textarea></div></div><div id=r class=tab><div class=card><textarea id=radar rows=14 placeholder='Canada, BC, Fraser Valley, Chilliwack notes'></textarea></div></div><div id=p class=tab><div class=card><textarea id=pred rows=14 placeholder='Predictions and scoring'></textarea></div></div><div id=b class=tab><div class=card><textarea id=brief rows=14 placeholder='Executive brief'></textarea></div></div><div id=sv class=tab><div class=card><textarea id=src rows=14 placeholder='Claim | Source1 | Source2 | Source3 | Verified'></textarea></div></div><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js')}function s(i){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(i).classList.add('active')}function save(){localStorage.ceipro=JSON.stringify({cdei:cdei.value,signals:signals.value,ammo:ammo.value,radar:radar.value,pred:pred.value,brief:brief.value,src:src.value})}document.addEventListener('input',save);window.onload=()=>{let d=JSON.parse(localStorage.ceipro||'{}');for(let k2 in d){let e=document.getElementById(k2);if(e)e.value=d[k2]} if(cdei.value)k.innerText=cdei.value+'/100'}</script></body></html>
